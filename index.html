<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title> Calculadora </title>
</head>

<body class="dark">
        
    <div class="fundo">
        
            <div class="content-btn">
                <button id="tema" class="btn-tema">
                    <span class="bolinha">☀️</span>
                </button>
            </div>
                
           
        <div class="calculadora">

            <div class="resultado" id="resultado">
                
            </div>

            <table>

                <tr>
                    <td><button class="acao"onclick="clean()"> C </button></td>
                    <td><button class="acao" onclick="porcentagem()"> % </button></td>
                    <td><button class="acao" onclick="back()"> DEL </button></td>
                    <td><button class="operador" onclick="insert('/')"> / </button></td>
                </tr>

                <tr>
                    <td><button class="numero" onclick="insert(7)"> 7 </button></td>
                    <td><button class="numero" onclick="insert(8)"> 8 </button></td>
                    <td><button class="numero" onclick="insert(9)"> 9 </button></td>
                    <td><button class="operador"  onclick="insert('*')"> x </button></td>
                </tr>

                <tr>
                    <td><button class="numero"onclick="insert(4)"> 4 </button></td>
                    <td><button class="numero"onclick="insert(5)"> 5 </button></td>
                    <td><button class="numero"onclick="insert(6)"> 6 </button></td>
                    <td><button class="operador" onclick="insert('-')"> - </button></td>
                </tr>

                <tr>
                    <td><button class="numero"onclick="insert(1)"> 1 </button></td>
                    <td><button class="numero"onclick="insert(2)"> 2 </button></td>
                    <td><button class="numero"onclick="insert(3)"> 3 </button></td>
                    <td><button class="operador" onclick="insert('+')"> + </button></td>
                </tr>

                <tr>
                    <td rowspan="2"><button class="numero" onclick="insert(0)"> 0 </button></td>
                    <td><button class="numero" onclick="insert('.')"> . </button></td>
                    <td colspan="2"><button class="operador-igual" onclick="calcular()"> = </button></td>
                </tr>

            </table>

        </div>
    </div>

   <script src="script.js"></script>
</body>
</html>
